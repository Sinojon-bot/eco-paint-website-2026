<!doctype html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Eco Paint Тоҷикистон</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Eco Paint — рангҳои экологӣ дар Тоҷикистон: эмулсия, фасад, декоративӣ, грунтовка ва клей ПВА. Ҳисобкунаки ранг ва фармоиш тавассути WhatsApp.">
  <meta name="theme-color" content="#087532">
  <meta property="og:title" content="Eco Paint Тоҷикистон">
  <meta property="og:description" content="Рангҳои экологӣ, ҳисобкунаки ранг ва фармоиш тавассути WhatsApp.">
  <meta property="og:image" content="images/modern-house.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23087532'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=19">
  <link rel="stylesheet" href="language.css?v=19">
  <link rel="stylesheet" href="features.css?v=19">
  <script>
    // Агар телефон нусхаи кӯҳнаро нигоҳ дошта бошад — як бор нав мекунад.
    (function () {
      var V = "19";
      try {
        // Каталоги кӯҳнаи ҳар дастгоҳро пок кун — ҳама аз интернет мегиранд.
        localStorage.removeItem("ecoPaintProductsAutoV4");
        localStorage.removeItem("ecoPaintProductsAutoV3");
        localStorage.removeItem("ecoPaintProductsAutoV2");
        localStorage.removeItem("ecoPaintProductsAutoV1");
        if (localStorage.getItem("ecoPaintSiteV") !== V) {
          localStorage.setItem("ecoPaintSiteV", V);
          if (!/[?&]fresh=1/.test(location.search)) {
            location.replace(location.pathname + "?fresh=1&v=" + V + "&t=" + Date.now());
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">Eco<b>paint</b></div>
      <label class="search">
        ⌕
        <input id="search" type="search" autocomplete="off">
      </label>
      <div class="language-picker" aria-label="Интихоби забон">
        <button data-lang="tg" title="Тоҷикӣ">
          <img src="flags/tj.svg" alt="Тоҷикӣ">
        </button>
        <button data-lang="zh" title="中文">
          <img src="flags/cn.svg" alt="中文">
        </button>
        <button data-lang="ru" title="Русский">
          <img src="flags/ru.svg" alt="Русский">
        </button>
        <button data-lang="en" title="English">
          <img src="flags/gb.svg" alt="English">
        </button>
        <button data-lang="fa" title="فارسی">
          <img src="flags/ir.svg" alt="فارسی">
        </button>
      </div>
      <button id="openCart" class="cartBtn" type="button" aria-label="Сабад">
        🛒<b id="badge">0</b>
      </button>
    </header>

    <section id="catalogPage" class="catalog-page">
      <nav id="categories" class="chips"></nav>
      <div class="feature-bar">
        <button id="calculatorBtn"><b>⌗</b><span id="calculatorLabel"></span><i>→</i></button>
        <button id="visualizerBtn"><b>◉</b><span id="visualizerLabel"></span><i>→</i></button>
      </div>
      <div class="heading">
        <h1 id="title"></h1>
        <span id="productCount"></span>
      </div>
      <section id="products" class="grid"></section>
    </section>

    <section id="contact" class="contact profile-page hidden">
      <h1 id="contactTitle"></h1>
      <div class="profile-card">
        <div id="profileAvatar" class="profile-avatar">👤</div>
        <section id="profileView" class="profile-view">
          <h2 id="profileDisplayName">Меҳмон</h2>
          <p id="profileDisplayCity"></p>
          <p id="profileDisplayPhone"></p>
          <button id="editProfile" class="secondary-action" type="button"></button>
          <button id="profileLogout" class="profile-logout" type="button">Баромадан</button>
          <a
            id="profileWhatsApp"
            class="whatsapp-action"
            href="https://wa.me/992554900600"
            target="_blank"
            rel="noopener"
          >WhatsApp</a>
        </section>
        <form id="profileForm" class="profile-editor hidden">
          <div>
            <span id="chooseAvatarLabel" class="field-title"></span>
            <div class="avatar-options">
              <button type="button" data-avatar="👤">👤</button>
              <button type="button" data-avatar="🧑">🧑</button>
              <button type="button" data-avatar="👨">👨</button>
              <button type="button" data-avatar="👩">👩</button>
              <button type="button" data-avatar="👨‍🔧">👨‍🔧</button>
              <button type="button" data-avatar="👷">👷</button>
            </div>
            <label class="gallery-button">
              <span id="galleryLabel"></span>
              <input id="profileImage" type="file" accept="image/*">
            </label>
          </div>
        <label>
          <span id="profileNameLabel"></span>
          <input id="profileName" autocomplete="name">
        </label>
        <label>
          <span id="profilePhoneLabel"></span>
          <input id="profilePhone" type="tel" autocomplete="tel">
        </label>
        <label>
          <span id="profileCityLabel"></span>
          <input id="profileCity" autocomplete="address-level2">
        </label>
        <button id="saveProfile" class="action"></button>
        <button id="cancelProfile" class="secondary-action" type="button"></button>
        </form>
        <p id="profileMessage" class="profile-message"></p>
      </div>
    </section>

    <nav class="bottom">
      <button id="catalogBtn" class="active">
        ▦<span id="catalogLabel"></span>
      </button>
      <button id="cartNav">
        🛒<span id="cartLabel"></span>
      </button>
      <button id="contactBtn">
        👤<span id="contactLabel"></span>
      </button>
    </nav>
  </main>

  <div id="overlay" class="overlay hidden">
    <section class="sheet">
      <i></i>
      <button id="close" class="close" type="button" aria-label="Close">×</button>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div id="authOverlay" class="auth-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <section class="auth-dialog">
      <button id="closeAuth" class="auth-close" type="button" aria-label="Close">×</button>
      <div class="auth-brand"><span class="auth-mark">E</span><strong>Eco <b>paint</b></strong></div>
      <h2 id="authTitle">Бақайдгирӣ</h2>
      <p id="authDescription">Барои харид маълумотро як бор нигоҳ доред</p>
      <form id="quickRegister" class="quick-register">
        <label><span id="authNameLabel">Ному насаб</span><input id="authName" autocomplete="name" required></label>
        <label><span id="authPhoneLabel">Рақами телефон</span><input id="authPhone" type="tel" autocomplete="tel" inputmode="tel" required></label>
        <label><span id="authCityLabel">Шаҳр ё ноҳия</span><input id="authCity" autocomplete="address-level2" required></label>
        <button id="authSubmit" type="submit">Бақайдгирӣ</button>
      </form>
      <p id="authError" class="auth-error hidden"></p>
      <small id="authPrivacy">Ном, телефон ва шаҳр танҳо барои фармоиш нигоҳ дошта мешаванд.</small>
    </section>
  </div>

  <script src="script.js?v=19" defer></script>
  <script defer>
    (function () {
      function load(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      window.ecoPaintLoadTesseract = function () {
        if (window.Tesseract) return Promise.resolve();
        return load("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
      };
      window.ecoPaintLoadWallVariants = function () {
        if (typeof WALL_IMAGE_VARIANTS !== "undefined") return Promise.resolve();
        return load("wall-variants-data.js");
      };
      window.addEventListener("load", async () => {
        try {
          await load("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
          await load("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js");
          await load("firebase-config.js?v=16");
          if (typeof startCloudCatalog === "function") startCloudCatalog();
        } catch (error) {
          console.warn("Cloud sync deferred load failed", error);
        }
      });
    })();
  </script>
</body>
</html>
